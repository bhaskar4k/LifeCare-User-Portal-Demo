<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Create account | LifeCare</title>
	<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
	<nav class="navbar"><a href="index.html" class="logo">LifeCare</a><a href="login.html" class="btn btn-secondary">Sign in</a></nav>
	<main class="auth-shell">
		<section class="auth-card">
			<div class="eyebrow">A healthier rhythm starts here</div>
			<h1>Make room for better habits.</h1>
			<p>Create your demo account and book a first conversation with a care expert.</p>
			<form>
				<div class="form-group"><label for="name">Full name</label><input id="name" type="text" placeholder="Your name"></div>
				<div class="form-group"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com"></div>
				<div class="form-group"><label for="password">Create password</label><input id="password" type="password" placeholder="At least 8 characters"></div>
				<a href="dashboard/index.html" class="btn btn-primary">Create my account</a>
			</form>
			<p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
		</section>
	</main>
</body>
</html>
