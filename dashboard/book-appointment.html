<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width">

    <title>Book Appointment</title>

    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

    <nav class="navbar">

        <a href="../index.html" class="logo">

            LifeCare

        </a>

    </nav>


    <div class="dashboard-layout">

        <aside class="sidebar">

            <a href="index.html">
                Dashboard
            </a>

            <a href="book-appointment.html" class="active">

                Book Appointment

            </a>

            <a href="track-appointment.html">
                Track Appointment
            </a>

            <a href="appointment-history.html">
                Appointment History
            </a>

            <a href="feedback.html">
                Feedback
            </a>

        </aside>


        <main class="dashboard-content">

            <div class="eyebrow">Make time for yourself</div>
            <h1>Book an appointment</h1>
            <p>Choose a specialist and a time that works for your routine.</p>

            <br>


            <div class="card form-container">

                <div class="form-grid">

                <div class="form-group">

                    <label>Select Doctor</label>

                    <select>

                        <option>Dr. Priya Sharma</option>

                        <option>Dr. Rahul Sen</option>

                        <option>Dr. Ananya Roy</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Consultation Type</label>

                    <select>

                        <option>Nutrition</option>

                        <option>Fitness</option>

                        <option>Wellness</option>

                        <option>Stress Management</option>

                    </select>

                </div>

                </div>


                <div class="form-group">

                    <label>Date</label>

                    <input type="date">

                </div>


                <div class="form-group">

                    <label>Time</label>

                    <input type="time">

                </div>


                <div class="form-group">

                    <label>Your Concern</label>

                    <textarea placeholder="Describe your concern...">
                </textarea>

                </div>


                <a href="track-appointment.html" class="btn btn-primary">

                    Confirm Appointment

                </a>

            </div>

        </main>

    </div>

</body>

</html>
