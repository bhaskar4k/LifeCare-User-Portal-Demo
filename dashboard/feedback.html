<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width">

    <title>Feedback</title>

    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

    <nav class="navbar">

        <a href="../index.html" class="logo">

            LifeCare

        </a>

    </nav>


    <div class="dashboard-layout">

        <aside class="sidebar">

            <a href="index.html">
                Dashboard
            </a>

            <a href="book-appointment.html">
                Book Appointment
            </a>

            <a href="track-appointment.html">
                Track Appointment
            </a>

            <a href="appointment-history.html">
                Appointment History
            </a>

            <a href="feedback.html" class="active">

                Feedback
            </a>

        </aside>


        <main class="dashboard-content">

            <div class="eyebrow">Help us make care better</div>
            <h1>Share your feedback</h1>
            <p>Your experience helps us support people like you.</p>

            <br>


            <div class="card form-container">

                <div class="form-group">

                    <label>
                        Rate Your Experience
                    </label>

                    <select>

                        <option>
                            Select Rating
                        </option>

                        <option>
                            ⭐⭐⭐⭐⭐ Excellent
                        </option>

                        <option>
                            ⭐⭐⭐⭐ Good
                        </option>

                        <option>
                            ⭐⭐⭐ Average
                        </option>

                        <option>
                            ⭐⭐ Poor
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Your Feedback
                    </label>

                    <textarea placeholder="Write your feedback...">
                </textarea>

                </div>


                <button class="btn btn-primary">

                    Submit Feedback

                </button>

            </div>

        </main>

    </div>

</body>

</html>
