<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in | LifeCare</title>
	<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
	<nav class="navbar"><a href="index.html" class="logo">LifeCare</a><a href="doctors.html" class="btn btn-secondary">Meet the doctors</a></nav>
	<main class="auth-shell">
		<section class="auth-card">
			<div class="eyebrow">Welcome back</div>
			<h1>Your health, in view.</h1>
			<p>Sign in to manage your appointments and keep your care journey moving.</p>
			<form>
				<div class="form-group"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com"></div>
				<div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="Enter your password"></div>
				<a href="dashboard/index.html" class="btn btn-primary">Sign in to LifeCare</a>
			</form>
			<p class="auth-switch">New to LifeCare? <a href="register.html">Create an account</a></p>
		</section>
	</main>
</body>
</html>
